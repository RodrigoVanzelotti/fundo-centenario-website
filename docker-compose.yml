services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "pip install --no-cache-dir -r backend/requirements.txt && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      PUBLIC_BASE_URL: http://localhost:8000
      SERVE_FRONTEND: "true"
      PAYMENT_PROVIDER: mock
      ENABLE_MOCK_PSP: "true"
      DATA_DIR: /app/backend/data
    ports:
      - "8000:8000"
