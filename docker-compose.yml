# Desenvolvimento local apenas. Produção utiliza a imagem construída pelo Dockerfile.
services:
  web:
    build: .
    volumes:
      - ./backend/app:/app/backend/app:ro
      - ./backend/templates:/app/backend/templates:ro
      - ./frontend:/app/frontend:ro
      - donation-data:/var/lib/fundo-centenario
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend/app --no-access-log
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      PUBLIC_BASE_URL: http://localhost:8000
      SERVE_FRONTEND: "true"
      PAYMENT_PROVIDER: mock
      ENABLE_MOCK_PSP: "true"
      EMAIL_ENABLED: "false"
      DATA_DIR: /var/lib/fundo-centenario
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  donation-data:
